spring:
  application:
    name: sigoh-api

  datasource:
    url: jdbc:postgresql://localhost:5432/sigoh
    username: sigoh
    password: sigoh

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

sigoh:
  jwt:
    secret: ${JWT_SECRET:sigoh-dev-secret-troque-em-producao-0123456789}
    expiracao-horas: 8
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
