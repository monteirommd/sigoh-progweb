services:
  db:
    image: postgres:16
    container_name: sigoh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigoh
      POSTGRES_USER: sigoh
      POSTGRES_PASSWORD: sigoh
    ports:
      - "5432:5432"
    volumes:
      - sigoh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigoh -d sigoh"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: sigoh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sigoh
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: sigoh-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sigoh-data:
