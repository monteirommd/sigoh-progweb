services:
  db:
    image: postgres:16
    container_name: sigoh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigoh
      POSTGRES_USER: sigoh
      POSTGRES_PASSWORD: sigoh
    ports:
      - "5432:5432"
    volumes:
      - sigoh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigoh -d sigoh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sigoh-data:
